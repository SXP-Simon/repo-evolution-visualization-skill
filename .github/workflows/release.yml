name: Release Publication

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building release for tag: $TAG"

      - name: Package Distribution Bundles
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p dist

          # 1. Package entire repository bundle
          zip -r "dist/repo-evolution-visualizer-bundle-${TAG}.zip" skills/ README.md LICENSE -x "*.pyc" "*__pycache__*"

          # 2. Package individual skill bundle
          cd skills
          zip -r "../dist/repo-evolution-visualizer-${TAG}.zip" repo-evolution-visualizer/ -x "*.pyc" "*__pycache__*"
          cd ..

          ls -lh dist/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/repo-evolution-visualizer-*.zip
            assets/demo_preview.png
            assets/demo_animation.gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
